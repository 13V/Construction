name: Refresh the demo tenant

# Run by hand, not on a schedule, and that is the whole point of this comment.
#
# It was nightly. The reason was that the demo world is anchored to Adelaide's
# today, so left alone it becomes an app with nothing happening in it — which
# is what an App Review reviewer would open.
#
# Two things killed that reasoning. App Review no longer opens the demo: they
# sign into appstore.review@crewline.app, a separate tenant that is frozen on
# purpose. And the reseed is not read-only — it closes open shifts and moves
# every date onto today. It ran against the account named in the review notes
# while version 1.0 was in review, which meant a reviewer watched records
# change with nobody touching the phone. That drew a rejection under guideline
# 5.6: manipulative behaviour, features "intentionally hidden during the
# review process".
#
# So the demo world going stale is now a cosmetic problem for whoever taps
# "Try the demo", and reseeding it on a timer is a way to get an app rejected.
# Dispatch it deliberately, when somebody wants the demo fresh and nothing is
# in front of App Review.
#
# scripts/.review-hold blocks the seed regardless while a submission is open.
on:
  workflow_dispatch:
    # Leave every input blank and this reseeds the public demo (blocked by
    # scripts/.review-hold while something is in front of App Review). Give
    # it an email and it builds a brand new company for that person instead —
    # a populated tenant to test on, pre-confirmed, that touches nobody else's.
    inputs:
      email:
        description: 'Owner login for a NEW test company (blank = reseed the public demo)'
        required: false
        default: ''
      password:
        description: 'Their password (blank = generate one and show it in the run summary)'
        required: false
        default: ''
      company:
        description: 'Company name shown in the app'
        required: false
        default: 'Test Tiling Co'
      owner:
        description: "Owner's name"
        required: false
        default: 'Test Owner'
      legal:
        description: 'Legal entity name on documents'
        required: false
        default: 'Test Tiling Pty Ltd'
  # The same button, for the GitHub App that automates this repo: it can push
  # but cannot fire workflow_dispatch (no actions:write). A push to this branch
  # builds the test company described in scripts/test-company.json — email,
  # company, owner, legal name; never a password — and leaves the generated
  # login in a one-day artifact for whoever pushed. The branch carries no
  # development; it only ever points at whatever should be seeded next.
  push:
    branches: [seed/test-company]

concurrency:
  group: demo-refresh
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The script imports nothing but node:fs and uses global fetch, so there
      # is no install step. It needs the anon key — the same secret the iOS
      # build already uses, under the same name — and the service_role key,
      # which is what mints pre-confirmed users. A SUPABASE_PAT works instead
      # of the service key (the script reads the key through the management
      # API with it) but is a whole-account token for a one-key job; prefer
      # the key itself.
      - name: Check the secrets are there
        run: |
          missing=
          [ -n "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ] || missing="$missing VITE_SUPABASE_ANON_KEY"
          [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}${{ secrets.SUPABASE_PAT }}" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "SUPABASE_SERVICE_ROLE_KEY is the project's service_role key"
            echo "(Supabase → Project Settings → API). VITE_SUPABASE_ANON_KEY is"
            echo "the anon key the iOS build already uses."
            exit 1
          fi

      # A generated password is masked in the log but written to the step
      # summary on purpose: the person who dispatched the run is the person
      # who needs it, and the summary is only visible to people with access
      # to this repository's Actions.
      - name: Settle the login
        id: login
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            f=scripts/test-company.json
            [ -f "$f" ] || { echo "::error::$f is missing — a push to seed/test-company needs it"; exit 1; }
            email=$(jq -r '.email // ""' "$f"); company=$(jq -r '.company // ""' "$f")
            owner=$(jq -r '.owner // ""' "$f"); legal=$(jq -r '.legal // ""' "$f"); pw=
          else
            email='${{ inputs.email }}'; company='${{ inputs.company }}'
            owner='${{ inputs.owner }}'; legal='${{ inputs.legal }}'; pw='${{ inputs.password }}'
          fi
          if [ -n "$email" ] && [ -z "$pw" ]; then
            pw="$(openssl rand -base64 18 | tr -d '/+=' | cut -c1-16)-$(shuf -i 10-99 -n 1)"
          fi
          [ -z "$pw" ] || echo "::add-mask::$pw"
          {
            echo "email=$email"; echo "company=$company"; echo "owner=$owner"
            echo "legal=$legal"; echo "password=$pw"
          } >> "$GITHUB_OUTPUT"

      - name: Reseed
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          # Only set when an email was given; the script then ignores the
          # review hold, because it is writing to a company that did not exist
          # a minute ago and App Review has never seen.
          SEED_NEW_TENANT: ${{ steps.login.outputs.email != '' && '1' || '' }}
          DEMO_EMAIL: ${{ steps.login.outputs.email }}
          DEMO_PASSWORD: ${{ steps.login.outputs.password }}
          COMPANY_NAME: ${{ steps.login.outputs.company }}
          OWNER_NAME: ${{ steps.login.outputs.owner }}
          LEGAL_NAME: ${{ steps.login.outputs.legal }}
          # Blank inputs reach the script as empty strings, which it treats as
          # unset (pick(), not ??) — so a plain dispatch still reseeds the demo.
        run: node scripts/seed-demo.mjs

      - name: Write the login to the summary and an artifact
        if: steps.login.outputs.email != ''
        run: |
          mkdir -p "$RUNNER_TEMP/login"
          {
            echo "Company   ${{ steps.login.outputs.company }}"
            echo "Email     ${{ steps.login.outputs.email }}"
            echo "Password  ${{ steps.login.outputs.password }}"
          } > "$RUNNER_TEMP/login/test-company-login.txt"
          {
            echo "### Test company ready"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Company | ${{ steps.login.outputs.company }} |"
            echo "| Sign in as | \`${{ steps.login.outputs.email }}\` |"
            echo "| Password | \`${{ steps.login.outputs.password }}\` |"
            echo ""
            echo "Pre-confirmed — no email to click. Sign in on the phone or at"
            echo "the /worker URL. The same three lines are in the run's"
            echo "\`test-company-login\` artifact for one day."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.login.outputs.email != ''
        with:
          name: test-company-login
          path: ${{ runner.temp }}/login/test-company-login.txt
          retention-days: 1
