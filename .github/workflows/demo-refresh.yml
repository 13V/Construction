name: Refresh the demo tenant

# Run by hand, not on a schedule, and that is the whole point of this comment.
#
# It was nightly. The reason was that the demo world is anchored to Adelaide's
# today, so left alone it becomes an app with nothing happening in it — which
# is what an App Review reviewer would open.
#
# Two things killed that reasoning. App Review no longer opens the demo: they
# sign into appstore.review@crewline.app, a separate tenant that is frozen on
# purpose. And the reseed is not read-only — it closes open shifts and moves
# every date onto today. It ran against the account named in the review notes
# while version 1.0 was in review, which meant a reviewer watched records
# change with nobody touching the phone. That drew a rejection under guideline
# 5.6: manipulative behaviour, features "intentionally hidden during the
# review process".
#
# So the demo world going stale is now a cosmetic problem for whoever taps
# "Try the demo", and reseeding it on a timer is a way to get an app rejected.
# Dispatch it deliberately, when somebody wants the demo fresh and nothing is
# in front of App Review.
#
# scripts/.review-hold blocks the seed regardless while a submission is open.
on:
  workflow_dispatch:

concurrency:
  group: demo-refresh
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The script imports nothing but node:fs and uses global fetch, so there
      # is no install step. Its inputs are three secrets.
      - name: Check the secrets are there
        run: |
          missing=
          [ -n "${{ secrets.SUPABASE_PAT }}" ] || missing="$missing SUPABASE_PAT"
          [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ] || missing="$missing SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings → Secrets and variables → Actions."
            echo "SUPABASE_PAT is a Supabase personal access token (the seed reads"
            echo "the service_role key with it). SUPABASE_ANON_KEY is the project's"
            echo "anon key — the same one the web build already uses."
            exit 1
          fi

      - name: Reseed
        env:
          SUPABASE_PAT: ${{ secrets.SUPABASE_PAT }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node scripts/seed-demo.mjs
